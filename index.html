<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>青禾年度計畫</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2127;--muted:#6b7280;--green:#1f7a4d;--blue:#2f6fb5;--orange:#c4572a;--purple:#5b4ea8;--red:#c62828;--line:#e5e1d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding-bottom:84px}
header{background:var(--green);color:#fff;padding:16px 16px 14px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.card h3{margin:0 0 4px;font-size:16px}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;margin-left:6px;color:#fff;background:#888;vertical-align:1px}
.tag.late{background:var(--red)}.tag.soon{background:var(--orange)}.tag.done{background:var(--green)}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 12px;flex:1;background:#eceae4;color:var(--ink)}
button.primary{background:var(--green);color:#fff}button.blue{background:var(--blue);color:#fff}
select,textarea,input[type=range]{width:100%;font:inherit}
select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea{min-height:84px}
.bar{height:8px;background:#ece8df;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
.big{font-size:30px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{text-align:center;padding:9px 0 10px;font-size:13px;color:var(--muted);text-decoration:none}
nav a b{display:block;font-size:20px}nav a.on{color:var(--green);font-weight:700}
.msg{padding:14px;border-radius:12px;background:#fff8e1;border:1px solid #f2d27a}
.ok{background:#e8f5ee;border-color:#9fd3b5}
</style>
</head>
<body>
<header><h1 id="title">青禾年度計畫</h1><p id="who">載入中…</p></header>
<main id="app"><div class="msg">正在連線 LINE…</div></main>
<nav>
  <a href="#" data-v="tasks"><b>📋</b>我的任務</a>
  <a href="#" data-v="report"><b>✅</b>回報進度</a>
  <a href="#" data-v="overview"><b>📊</b>進度總覽</a>
  <a href="#" data-v="bind"><b>🔗</b>綁定身分</a>
</nav>
<script>
const LIFF_ID = '2012685794-xUq0hxyv';
const API = 'https://script.google.com/macros/s/AKfycbwnCXoFYzodW1rhhrSlf5ULaYvy1KE5GqCMpMIlm9Hw8zytgdQMO7ejvTwYoFhuKpWz/exec';
const app = document.getElementById('app');
let idToken = '', state = { me: '', admin: false, tasks: [] };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function call(action, params = {}) {
  const q = new URLSearchParams({ action, idToken, ...params });
  const r = await fetch(API + '?' + q.toString());
  return r.json();
}
function show(html) { app.innerHTML = html; }
function tag(t) {
  if (t.status === '已完成') return '<span class="tag done">已完成</span>';
  if (t.days !== null && t.days < 0) return `<span class="tag late">逾期 ${-t.days} 天</span>`;
  if (t.days !== null && t.days <= 7) return `<span class="tag soon">剩 ${t.days} 天</span>`;
  return `<span class="tag">${esc(t.status)}</span>`;
}
function setNav(v) { document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v)); }

async function view(v) {
  setNav(v);
  show('<div class="msg">讀取中…</div>');
  if (v === 'bind') return bindView();
  const res = await call(v === 'overview' ? 'overview' : 'me');
  if (!res.ok) return show(`<div class="msg">${esc(res.error)}</div>` + (res.needBind ? '<div class="row"><button class="primary" onclick="view(\'bind\')">去綁定身分</button></div>' : ''));
  if (res.me) { state.me = res.me; document.getElementById('who').textContent = res.me + (res.admin ? '（管理者）' : ''); }
  if (v === 'overview') return overviewView(res.overview);
  state.tasks = res.tasks; state.admin = res.admin;
  return v === 'report' ? reportView() : tasksView();
}

function tasksView() {
  const t = state.tasks;
  if (!t.length) return show('<div class="msg">你目前沒有負責的任務。</div>');
  show(t.map(x => `<div class="card"><h3>${esc(x.id)} ${esc(x.name)}${tag(x)}</h3>
    <div class="meta">截止 ${esc(x.due)}｜完成度 ${x.status === '已完成' ? 100 : x.progress}%${x.note ? '｜' + esc(x.note) : ''}</div>
    <div class="bar"><i style="width:${x.status === '已完成' ? 100 : x.progress}%"></i></div>
    <div class="row"><button onclick="setStatus('${esc(x.id)}','進行中')">進行中</button>
    <button class="primary" onclick="setStatus('${esc(x.id)}','已完成')">一鍵完成</button></div></div>`).join(''));
}
async function setStatus(id, status) {
  const res = await call('update', { id, status });
  if (!res.ok) return alert(res.error);
  state.tasks = res.tasks; tasksView();
}

function reportView() {
  const t = state.tasks.filter(x => x.status !== '已完成');
  if (!t.length) return show('<div class="msg ok">你的任務都完成了 👏</div>');
  show(`<div class="card"><h3>回報進度</h3>
    <label class="meta">選擇任務</label><select id="rid">${t.map(x => `<option value="${esc(x.id)}">${esc(x.id)} ${esc(x.name)}</option>`).join('')}</select>
    <p class="meta" style="margin:12px 0 0">完成度 <b id="pv">${t[0].progress}</b>%</p>
    <input type="range" id="rp" min="0" max="100" step="10" value="${t[0].progress}" oninput="pv.textContent=this.value">
    <label class="meta">備註（一句話說明進度或卡關）</label><textarea id="rn" placeholder="例如：已和全聯採購開會，等報價"></textarea>
    <div class="row"><button class="primary" onclick="sendReport()">送出回報</button></div></div>`);
  document.getElementById('rid').onchange = e => { const x = t.find(y => y.id === e.target.value); rp.value = x.progress; pv.textContent = x.progress; };
}
async function sendReport() {
  const id = rid.value, progress = rp.value, note = rn.value.trim();
  const res = await call('update', { id, progress, note, status: Number(progress) >= 100 ? '已完成' : '進行中' });
  if (!res.ok) return alert(res.error);
  state.tasks = res.tasks;
  show(`<div class="msg ok">已回報 ${esc(id)}：${progress}%。主管可在「進度總覽」看到。</div><div class="row"><button onclick="view('tasks')">回到我的任務</button></div>`);
}

function overviewView(o) {
  const goals = o.goals.map(g => `<div class="card"><h3>${esc(g.goal)}<span class="tag">${g.done}/${g.total} 完成</span></h3>
    <div class="meta">平均完成度 ${g.rate}%</div><div class="bar"><i style="width:${g.rate}%"></i></div></div>`).join('');
  const owners = o.owners.map(x => `<div class="meta">・${esc(x.owner)}：${x.done}/${x.total} 完成${x.late ? `，<b style="color:var(--red)">逾期 ${x.late}</b>` : ''}</div>`).join('');
  const late = o.late.length ? o.late.map(x => `<div class="meta">・${esc(x.owner)}｜${esc(x.id)} ${esc(x.name)}（${esc(x.due)}）</div>`).join('') : '<div class="meta">目前沒有逾期任務</div>';
  show(`<div class="card"><div class="big">${o.done} / ${o.total}</div><div class="meta">已完成任務</div></div>
    ${goals}<div class="card"><h3>負責人</h3>${owners}</div><div class="card"><h3>逾期清單</h3>${late}</div>`);
}

async function bindView() {
  const res = await call('names');
  if (!res.ok) return show(`<div class="msg">${esc(res.error)}</div>`);
  const opts = res.names.map(n => `<option value="${esc(n.name)}" ${n.bound && n.name !== res.me ? 'disabled' : ''}>${esc(n.name)}${n.name === res.me ? '（目前的你）' : n.bound ? '（已綁定）' : ''}</option>`).join('');
  show(`<div class="card"><h3>綁定身分</h3><p class="meta">從名單選你自己。綁定後才會收到提醒、看得到自己的任務。</p>
    <select id="bn">${opts}</select><div class="row"><button class="primary" onclick="doBind()">確認綁定</button></div></div>`);
}
async function doBind() {
  const res = await call('bind', { name: bn.value });
  if (!res.ok) return alert(res.error);
  document.getElementById('who').textContent = res.me;
  show(`<div class="msg ok">已綁定：${esc(res.me)}</div><div class="row"><button class="primary" onclick="view('tasks')">看我的任務</button></div>`);
}

document.querySelectorAll('nav a').forEach(a => a.onclick = e => { e.preventDefault(); view(a.dataset.v); });
liff.init({ liffId: LIFF_ID }).then(() => {
  if (!liff.isLoggedIn()) return liff.login();
  idToken = liff.getIDToken();
  const v = new URLSearchParams(location.search).get('view') || 'tasks';
  view(['tasks', 'report', 'overview', 'bind'].includes(v) ? v : 'tasks');
}).catch(e => show(`<div class="msg">LINE 連線失敗：${esc(e.message)}</div>`));
</script>
</body>
</html>
